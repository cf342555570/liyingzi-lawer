"overseasVerName":"","overseasUpdateVerUrl":"https://console.huaweicloud.com/webmobile/?region=cn-north-4&locale=zh-cn#/cloudsite/upgrade/fk2025040717463967OHXQNZ?isCndns=false"}}],"lcid":{"qrcode":"二维码","newsDetailNotFound":"文章找不到","newsAttachDownloan":"附件下载","newsPrevOne":"上一篇","newsNextOne":"下一篇","share":"分享","siteFormNotLogin":"您没有登录，不能提交，请先","memberLoginLogin":"登录","productCommentCreator":"昵称","msgBoardContent":"内容：","hasNoComment":"暂无评论，快来发表吧~","comeToComment":"亲~快来评论噢！","verificationCode":"验证码","colon":"：","msgBoradChageValidateCode":"看不清，换一张","productCommentSubmit":"提交评论","anonymousUser":"匿名用户","daysAgo":"天前","yesterday":"昨天","hourAgo":"小时前","just":"刚刚"},"hideNews":false,"isCommentOpen":false,"isEmptyNews":false,"isNeedLogin":false,"currentNewsAttachAllow":true,"memberName":"","linkExternalNewsAuthInfo":{"auid":170,"aid":50008421,"allow":true,"name":"外链文章","minVer":10},"newsCommentLength":0,"newsInfo":{"pictureId":"","id":15,"imgPath":"//0-ss-sys.huaweicloudsite.cn/image/rimage/fromSite/default/noimage.jpg","imgWidth":0,"imgHeight":0,"title":"婚前房写进协议=白送一半？这起离婚案给了很多人当头一棒","summary":"很多人问律师：\u201C婚前房是他的名字，结婚前买的，万一离婚，我是不是一点也分不到？\u201D &nbsp;&nbsp;也有人说：\u201C他说婚后房子一人一半，还写在纸上了，这算不算真实有效？\u201D &nbsp;&nbsp;上海奉贤区有一件离婚案，就把这个问题讲得很清楚。故事的主角我们姑且叫他们贾先生和陈女士。两个人在 2014 年登记结婚，一年后有了孩子。比较特别的是，他们在领证前就签了一份《婚前约定协议书》。这份协议里有一套关键的房子：是陈女士婚前买...","url":"/nd.jsp?id=15&fromMid=0","ndReqArgs":"{}","flag":0,"groupIds":[3],"date":1769073540000,"dateStr":"2026-01-22","top":0,"views":1,"publishRegularly":false,"authStatus":0,"subTitle":"","groups":[{"id":3,"name":"案例","url":"/nr.jsp?groupId=3&jpt=4"}],"content":"<div class=\"jz_fix_ue_img\"><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">很多人问律师：\u201C婚前房是他的名字，结婚前买的，万一离婚，我是不是一点也分不到？\u201D&nbsp; &nbsp;<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">也有人说：\u201C他说婚后房子一人一半，还写在纸上了，这算不算真实有效？\u201D&nbsp; &nbsp;<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">上海奉贤区有一件离婚案，就把这个问题讲得很清楚。故事的主角我们姑且叫他们贾先生和陈女士。<\/span><\/p><p style=\"text-align:justify;text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">两个人在 2014 年登记结婚，一年后有了孩子。比较特别的是，他们在领证前就签了一份《婚前约定协议书》。这份协议里有一套关键的房子：是陈女士婚前买的，房本上只有她一个人的名字。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">在协议里，陈女士明确写下：这套婚前房，她自愿把所有权和居住权一起，作为婚后夫妻共同财产处理，也就是说，房子的一半产权和居住权，归贾先生所有。除此之外，两个人还写了几条看上去挺\u201C狠\u201D的约定，比如说，如果哪一方出轨，或者有严重赌博行为，就视为放弃房产所有权；又比如说，在对方没有过错的前提下，谁先提出离婚，谁就放弃房屋所有权。后来在法庭上，两个人也当庭确认，这些内容确实是当年自己写下并认可的。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">几年过去，两人的婚姻走到了尽头，贾先生起诉离婚。这时候，协议里的那套房子成了争议焦点：到底该怎么算？还是陈女士的个人财产？还是已经变成两个人共有的财产？那句\u201C谁先提离婚谁就放弃房子\u201D的约定，能不能算数？<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">在实践中，这类情况有两种常见观点。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">一种叫\u201C赠与说\u201D。意思是：一方把自己的婚前房子，赠与给另一方一部分，或者变成共同共有。如果按照这个思路，这件事就变成了\u201C陈女士要送贾先生一半房\u201D。按照相关司法解释的思路，在房子没有完成变更登记之前，这种赠与在一定条件下是可能被撤销的。简单理解就是：你当初说要送我一半房，但一直没把名字改过来，现在闹到离婚了，你说你后悔了，要把这份\u201C好意\u201D撤回去，这条路在法律上是有讨论空间的。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">另一种叫\u201C协议说\u201D。它认为，两个人通过书面协议，把\u201C婚前个人房产\u201D改为\u201C夫妻共同财产\u201D，本质上是夫妻双方对财产的一次共同安排，是一个双方平等协商后的结果。这种安排，属于《民法典》里说的\u201C夫妻对婚前、婚后财产的约定\u201D，一旦约定达成，就对双方有约束力，不能轻易翻脸不认。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">这两种说法的背后，是对婚姻关系中\u201C财产\u201D和\u201C承诺\u201D的两种不同理解。如果一概按照\u201C赠与\u201D处理，看上去好像符合\u201C谁的房谁说了算\u201D，但同时也会留下一个隐患：一些人在婚姻开始时，用\u201C房子一人一半\u201D的承诺博取信任，等到感情耗尽，再打着\u201C我只是赠与你，现在我要撤回\u201D的旗号，把承诺收回。这种结果，无论从法律上的公平，还是从普通人的朴素观感来看，都很难让人接受。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">本案中，上海奉贤区法院选择了后者\u2014\u2014\u201C协议说\u201D的路径。法院认为，贾先生和陈女士在结婚前，通过书面协议，把陈女士的婚前房约定为夫妻共同财产，属于夫妻双方对婚前财产的共同约定，符合《民法典》的规定，应该认定为一份有效的夫妻财产协议，而不是简单的一份赠与承诺。这样一来，这套房子在法律上，就不再是\u201C陈女士一个人的房\u201D，而是两个人一人一半的共同财产，不能在离婚时再被轻易\u201C收回\u201D。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">不过，故事并没有这么简单。协议里还有一句话：\u201C任何一方在对方没有过错的情况下先提出离婚的，视为放弃该房屋所有权。\u201D 这句在现实生活中非常常见，很多人写婚前协议、所谓\u201C忠诚协议\u201D时都会加上一句\u201C谁先提离婚谁净身出户\u201D，觉得这样对方就不敢轻易提分手了。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">但在法院看来，这样的约定问题不小。离婚权是法律赋予每个人的基本权利，只要符合法定条件，任何一方都有权提出解除婚姻关系。把\u201C率先提出离婚\u201D本身当成\u201C应受惩罚\u201D的行为，用\u201C一分钱不要、房子全放弃\u201D这种极端后果去捆绑，对离婚自由构成了实质上的限制，也冲击了公序良俗。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">因此，奉贤区法院专门就这一条作出了评价：这条约定明显限制了当事人的离婚自由，应当认定无效。换句话说：你们可以约定房子从一个人的变成两个人的，这是允许的；但不能约定\u201C谁先提离婚，谁就自动没收房子这份权利\u201D。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">在认定了哪一部分有效、哪一部分无效之后，房子该怎么分？因为关于\u201C房子变成夫妻共同财产、夫妻各半\u201D的部分是有效的，所以这套房子在离婚时，属于共同财产，应当按照各半来分。现实问题是，两个人都想拿房子归自己所有，但又都拿不出钱把对方的那一半\u201C折价买下来\u201D。法院多次调解无果，只能采用最朴素、但在目前情况下也算最公平的一种处理方式：确认这套房子还是由两个人共有，各占二分之一份额。至于离婚后房子谁住、将来要不要卖掉再分配、是否一方补偿另一方，这些留给双方以后再协商解决。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">这件案子，对普通人的启示，远远不止\u201C婚前房也可能变共同财产\u201D这么简单。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">第一，白纸黑字的书面协议，真的很重要。很多人总觉得谈钱伤感情、谈房显得现实，习惯把\u201C房子写你一半\u201D\u201C以后都是我们的\u201D这种承诺停留在嘴巴上。但在法律眼里，没有经过认真书面约定的口头承诺，很难成为真正稳定的权利基础。一旦出了事，谁怎么说、证据在哪儿、有没有第三方在场，都成为争执点。而本案之所以能够明确地把婚前房认定为夫妻共同财产，就在于双方当初确实认真写了一份协议，内容具体清晰，又签了字。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">第二，写在纸上的东西，也不是\u201C想写什么都有效\u201D。婚前协议、夫妻财产协议，不是私人契约就能凌驾于所有法律之上。协议内容，不能用来剥夺一个人的基本人身权利，也不能无底线地限制离婚自由。像\u201C谁先提离婚谁净身出户\u201D\u201C离婚后不得再婚\u201D\u201C不得再生育\u201D\u201C结婚后不许照顾父母\u201D这一类约定，看起来立场鲜明、态度强硬，但从法律角度看，大概率都是无效条款。写了，对方当时也许会点头，但真要走到法院，往往站不住脚。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">第三，婚前谈财产，不一定是不信任，反而有时是一种成熟。很多人在婚姻里之所以受伤，不是因为\u201C钱少\u201D，而是因为预期不清、不敢或者不好意思提前说明自己的边界。有人以为\u201C不谈钱才是真爱\u201D，但十年后发现，爱情消耗完了，留在台面上的，只有没有说清楚的房子、首付、月供和父母的养老。相比在离婚时边吵边哭、边怀疑\u201C你当初是不是就是算计好的\u201D，也许在婚前坐下来，冷静地把房子归属、婚后收入怎么处理、万一真的走到离婚那天怎么分配这些问题，坦诚写在纸上，对两个人都是一种保护。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\"><ins>最后，如果把本案浓缩成几句话给正在犹豫要不要做\u201C婚前约定\u201D的你，可能是这样几条：如果真的想把对方当作长期的生活搭档，不妨把\u201C钱\u201D和\u201C房\u201D也当作共同生活的一部分，而不是禁区；如果选择写协议，就尽量用平等、清晰的方式约定财产归属，避免用极端惩罚性条款去威胁或控制对方；如果已经有了类似约定，不妨拿出来重新看一看，想一想哪些条款合不合法、是否需要在今后生活中再做调整。<\/ins><\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">婚姻里的房子，表面上是一套不动产，背后却是两个人对\u201C我们\u201D的理解方式。是只写一个人的名字，还是写成两个人的名字，是说\u201C这是我的房，你来住\u201D，还是愿意在纸上写下\u201C这是我们的共同财产\u201D，每一种选择，其实都包含了各自的风险、责任和安全感。法律做不到保证每一段婚姻都不破裂，但至少可以在破裂的时候，让那些曾经被郑重写下的承诺，尽可能被公平地对待。<\/span><\/p><\/div>","isViewsOpen":false,"isQRCodeOpen":false,"author":"","source":"","link":"","showCaptcha":true,"downLoadFiles":{},"prevNext":{"hasPrev":true,"prevNewsUrl":"/nd.jsp?id=16#fai_2_top","prevNewsTitle":"离婚后孩子判给妈妈，却一直跟爸爸生活：一幅画改变了抚养权走向","hasNext":true,"nextNewsUrl":"/nd.jsp?id=14#fai_2_top","nextNewsTitle":"房产拆迁"},"richContent":"<div class=\"jz_fix_ue_img\"><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">很多人问律师：\u201C婚前房是他的名字，结婚前买的，万一离婚，我是不是一点也分不到？\u201D&nbsp; &nbsp;<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">也有人说：\u201C他说婚后房子一人一半，还写在纸上了，这算不算真实有效？\u201D&nbsp; &nbsp;<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">上海奉贤区有一件离婚案，就把这个问题讲得很清楚。故事的主角我们姑且叫他们贾先生和陈女士。<\/span><\/p><p style=\"text-align:justify;text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">两个人在 2014 年登记结婚，一年后有了孩子。比较特别的是，他们在领证前就签了一份《婚前约定协议书》。这份协议里有一套关键的房子：是陈女士婚前买的，房本上只有她一个人的名字。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">在协议里，陈女士明确写下：这套婚前房，她自愿把所有权和居住权一起，作为婚后夫妻共同财产处理，也就是说，房子的一半产权和居住权，归贾先生所有。除此之外，两个人还写了几条看上去挺\u201C狠\u201D的约定，比如说，如果哪一方出轨，或者有严重赌博行为，就视为放弃房产所有权；又比如说，在对方没有过错的前提下，谁先提出离婚，谁就放弃房屋所有权。后来在法庭上，两个人也当庭确认，这些内容确实是当年自己写下并认可的。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">几年过去，两人的婚姻走到了尽头，贾先生起诉离婚。这时候，协议里的那套房子成了争议焦点：到底该怎么算？还是陈女士的个人财产？还是已经变成两个人共有的财产？那句\u201C谁先提离婚谁就放弃房子\u201D的约定，能不能算数？<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">在实践中，这类情况有两种常见观点。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">一种叫\u201C赠与说\u201D。意思是：一方把自己的婚前房子，赠与给另一方一部分，或者变成共同共有。如果按照这个思路，这件事就变成了\u201C陈女士要送贾先生一半房\u201D。按照相关司法解释的思路，在房子没有完成变更登记之前，这种赠与在一定条件下是可能被撤销的。简单理解就是：你当初说要送我一半房，但一直没把名字改过来，现在闹到离婚了，你说你后悔了，要把这份\u201C好意\u201D撤回去，这条路在法律上是有讨论空间的。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">另一种叫\u201C协议说\u201D。它认为，两个人通过书面协议，把\u201C婚前个人房产\u201D改为\u201C夫妻共同财产\u201D，本质上是夫妻双方对财产的一次共同安排，是一个双方平等协商后的结果。这种安排，属于《民法典》里说的\u201C夫妻对婚前、婚后财产的约定\u201D，一旦约定达成，就对双方有约束力，不能轻易翻脸不认。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">这两种说法的背后，是对婚姻关系中\u201C财产\u201D和\u201C承诺\u201D的两种不同理解。如果一概按照\u201C赠与\u201D处理，看上去好像符合\u201C谁的房谁说了算\u201D，但同时也会留下一个隐患：一些人在婚姻开始时，用\u201C房子一人一半\u201D的承诺博取信任，等到感情耗尽，再打着\u201C我只是赠与你，现在我要撤回\u201D的旗号，把承诺收回。这种结果，无论从法律上的公平，还是从普通人的朴素观感来看，都很难让人接受。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">本案中，上海奉贤区法院选择了后者\u2014\u2014\u201C协议说\u201D的路径。法院认为，贾先生和陈女士在结婚前，通过书面协议，把陈女士的婚前房约定为夫妻共同财产，属于夫妻双方对婚前财产的共同约定，符合《民法典》的规定，应该认定为一份有效的夫妻财产协议，而不是简单的一份赠与承诺。这样一来，这套房子在法律上，就不再是\u201C陈女士一个人的房\u201D，而是两个人一人一半的共同财产，不能在离婚时再被轻易\u201C收回\u201D。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">不过，故事并没有这么简单。协议里还有一句话：\u201C任何一方在对方没有过错的情况下先提出离婚的，视为放弃该房屋所有权。\u201D 这句在现实生活中非常常见，很多人写婚前协议、所谓\u201C忠诚协议\u201D时都会加上一句\u201C谁先提离婚谁净身出户\u201D，觉得这样对方就不敢轻易提分手了。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">但在法院看来，这样的约定问题不小。离婚权是法律赋予每个人的基本权利，只要符合法定条件，任何一方都有权提出解除婚姻关系。把\u201C率先提出离婚\u201D本身当成\u201C应受惩罚\u201D的行为，用\u201C一分钱不要、房子全放弃\u201D这种极端后果去捆绑，对离婚自由构成了实质上的限制，也冲击了公序良俗。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">因此，奉贤区法院专门就这一条作出了评价：这条约定明显限制了当事人的离婚自由，应当认定无效。换句话说：你们可以约定房子从一个人的变成两个人的，这是允许的；但不能约定\u201C谁先提离婚，谁就自动没收房子这份权利\u201D。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">在认定了哪一部分有效、哪一部分无效之后，房子该怎么分？因为关于\u201C房子变成夫妻共同财产、夫妻各半\u201D的部分是有效的，所以这套房子在离婚时，属于共同财产，应当按照各半来分。现实问题是，两个人都想拿房子归自己所有，但又都拿不出钱把对方的那一半\u201C折价买下来\u201D。法院多次调解无果，只能采用最朴素、但在目前情况下也算最公平的一种处理方式：确认这套房子还是由两个人共有，各占二分之一份额。至于离婚后房子谁住、将来要不要卖掉再分配、是否一方补偿另一方，这些留给双方以后再协商解决。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">这件案子，对普通人的启示，远远不止\u201C婚前房也可能变共同财产\u201D这么简单。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">第一，白纸黑字的书面协议，真的很重要。很多人总觉得谈钱伤感情、谈房显得现实，习惯把\u201C房子写你一半\u201D\u201C以后都是我们的\u201D这种承诺停留在嘴巴上。但在法律眼里，没有经过认真书面约定的口头承诺，很难成为真正稳定的权利基础。一旦出了事，谁怎么说、证据在哪儿、有没有第三方在场，都成为争执点。而本案之所以能够明确地把婚前房认定为夫妻共同财产，就在于双方当初确实认真写了一份协议，内容具体清晰，又签了字。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">第二，写在纸上的东西，也不是\u201C想写什么都有效\u201D。婚前协议、夫妻财产协议，不是私人契约就能凌驾于所有法律之上。协议内容，不能用来剥夺一个人的基本人身权利，也不能无底线地限制离婚自由。像\u201C谁先提离婚谁净身出户\u201D\u201C离婚后不得再婚\u201D\u201C不得再生育\u201D\u201C结婚后不许照顾父母\u201D这一类约定，看起来立场鲜明、态度强硬，但从法律角度看，大概率都是无效条款。写了，对方当时也许会点头，但真要走到法院，往往站不住脚。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">第三，婚前谈财产，不一定是不信任，反而有时是一种成熟。很多人在婚姻里之所以受伤，不是因为\u201C钱少\u201D，而是因为预期不清、不敢或者不好意思提前说明自己的边界。有人以为\u201C不谈钱才是真爱\u201D，但十年后发现，爱情消耗完了，留在台面上的，只有没有说清楚的房子、首付、月供和父母的养老。相比在离婚时边吵边哭、边怀疑\u201C你当初是不是就是算计好的\u201D，也许在婚前坐下来，冷静地把房子归属、婚后收入怎么处理、万一真的走到离婚那天怎么分配这些问题，坦诚写在纸上，对两个人都是一种保护。<\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\"><ins>最后，如果把本案浓缩成几句话给正在犹豫要不要做\u201C婚前约定\u201D的你，可能是这样几条：如果真的想把对方当作长期的生活搭档，不妨把\u201C钱\u201D和\u201C房\u201D也当作共同生活的一部分，而不是禁区；如果选择写协议，就尽量用平等、清晰的方式约定财产归属，避免用极端惩罚性条款去威胁或控制对方；如果已经有了类似约定，不妨拿出来重新看一看，想一想哪些条款合不合法、是否需要在今后生活中再做调整。<\/ins><\/span><\/p><p style=\"text-indent:32px;line-height:2.5em;\"><span style=\"font-family:&quot;andale mono&quot;;font-size:16px;\">婚姻里的房子，表面上是一套不动产，背后却是两个人对\u201C我们\u201D的理解方式。是只写一个人的名字，还是写成两个人的名字，是说\u201C这是我的房，你来住\u201D，还是愿意在纸上写下\u201C这是我们的共同财产\u201D，每一种选择，其实都包含了各自的风险、责任和安全感。法律做不到保证每一段婚姻都不破裂，但至少可以在破裂的时候，让那些曾经被郑重写下的承诺，尽可能被公平地对待。<\/span><\/p><\/div>","isOpenNewsSubTitle":false,"copyrightNoticeOpen":false,"copyrightNoticeContent":"声明：此篇为长沙律师婚姻继承和资产保护原创文章，转载请标明出处链接：","newsLink":"http://www.buerlawyer.com/nd.jsp?id=15"},"isOnlyMember":false,"siteGfwNotAllow":false,"siteGfwNoticeTips":"为保障网络安全，该功能近期正在升级维护中，敬请期待！","newsGroupData":[{"id":3,"name":"案例","href":"/nr.jsp?groupId=3&jpt=4"}]},"module302":{"id":302,"type":1,"style":7,"flag":0,"name":"图片","prop1":"AD0ImpCpCRAEGAAgltSO5wUogLHemwQwjAQ4iQE","prop2":0,"prop3":{"ide":"","ib":false,"nf":false,"lt":0},"prop4":0,"prop5":"","prop7":{"mcf":-1,"br":0,"o":0,"st":0,"sx":0,"sy":0,"sb":0,"ss":0,"sc":"rgba(0, 0, 0, 0.20)","sm":{"w":0,"h":0,"l":0,"t":0},"ci":{"w":0,"h":0,"l":0,"t":0},"nid":"","brt":0,"niw":0,"nih":0,"nsrc":"//19548186.s61i.huaweicloudsite.cn/4/AD0ImpCpCRAEGAAgltSO5wUogLHemwQwjAQ4iQE.png"},"blob0":{"jumpWxAppData":{"type":0,"id":"","path":"","qzAppId":"","qzOriginalId":"","qzColId":-1},"jumpMode":0},"pattern":{"pc":{"by":1,"rf":0,"mf":{"y":0,"s":16,"f":"微软雅黑","w":0,"i":0,"d":0,"c":"#212121","ct":0,"sc":"#212121","hc":"#212121","ta":0,"ta2":-1,"hft":0,"sft":0,"lh":-1}},"mobi":{"by":1}},"privatePattern":{"pc":{},"mobi":{}},"deleteTime":1604045398000,"isDeleted":0,"commProp":{"al":[{"t":2,"r":3,"s":0.6,"d":0.0,"c":1,"o":0,"tg":0,"i":0},{"t":0}],"pa":{"mt":0,"t":0},"an":{"t":0,"n":"","nc":0},"im":0,"ps":{"t":0,"o":2},"ls":{"st":0},"more":{"moreType":0,"link":{"ide":"","ib":false,"nf":false,"lt":0}},"cal":[{"t":0}],"unst":true},"w":524,"h":137,"psrc":"//19548186.s61i.huaweicloudsite.cn/4/AD0ImpCpCRAEGAAgltSO5wUogLHemwQwjAQ4iQE.png"}},"rows":{"row3":{"id":3,"colId":11,"flag":1,"pattern":{"pc":{"wt":0,"ab":1,"ai":0,"l":1,"e":{"t":1,"s":0.1,"rst":0,"rp":3,"rsh":false,"rb":false,"rfb":true,"rm":0,"rbs":[{"p":1,"bg":{"y":0,"d":0,"c":"#fff","cp":0,"tc":"","tcp":100,"a":0,"r":0,"p":0,"s":3,"f":"","bt":0,"path":"","vf":"","vpath":"","viu":""},"cols":[{"type":0,"mIds":[153]
