backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1
  branch: main
  local_backend: true

media_folder: "site/static/images"
public_folder: "/assets/images"

site_url: https://cf342555570.github.io/liyingzi-lawer/
display_url: https://cf342555570.github.io/liyingzi-lawer/

i18n:
  structure: single_file
  locales: [zh]
  default_locale: zh

collections:
  - name: "articles"
    label: "文章管理"
    label_singular: "文章"
    folder: "content/articles"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "分类", name: "category", widget: "select", options: ["离婚纠纷", "彩礼返还", "房产分割", "子女抚养", "协议审查", "共同债务", "赠与返还", "离婚谈判", "涉外婚姻", "实用指南"] }
      - { label: "封面图", name: "cover", widget: "image", required: false }
      - { label: "来源说明", name: "source", widget: "string", required: false }
      - { label: "来源链接", name: "sourceUrl", widget: "string", required: false }
      - { label: "正文", name: "body", widget: "markdown" }
    view_filters:
      - { label: "离婚纠纷", field: "category", pattern: "离婚纠纷" }
      - { label: "实用指南", field: "category", pattern: "实用指南" }

  - name: "guides"
    label: "指南管理"
    label_singular: "指南"
    folder: "content/guide"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "描述", name: "description", widget: "text" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: "site_config"
    label: "站点设置"
    editor:
      preview: false
    files:
      - label: "站点配置"
        name: "site_config"
        file: "site/data/site-config.json"
        fields:
          - { label: "联系电话", name: "phone", widget: "string" }
          - { label: "公众号", name: "wechat", widget: "string", default: "英姿律见" }
          - { label: "站点标语", name: "slogan", widget: "string" }
          - { label: "地址", name: "address", widget: "string" }
          - { label: "高德导航链接", name: "amapNavigationUrl", widget: "string" }
          - { label: "到访提示", name: "transitNote", widget: "string" }
          - { label: "免责声明", name: "disclaimer", widget: "text" }
          - { label: "Slogan提示", name: "sloganNotice", widget: "text" }
          - { label: "页脚官方说明", name: "footerOfficialText", widget: "text" }

  - name: "faqs"
    label: "FAQ管理"
    editor:
      preview: false
    files:
      - label: "首页FAQ"
        name: "home_faqs"
        file: "site/data/home-faqs.json"
        fields:
          - label: "FAQ列表"
            name: "faqs"
            widget: "list"
            fields:
              - { label: "问题", name: "question", widget: "string" }
              - { label: "回答", name: "answer", widget: "text" }

  - name: "navigation"
    label: "导航栏管理"
    editor:
      preview: false
    files:
      - label: "顶部导航"
        name: "main_navigation"
        file: "site/data/navigation.json"
        fields:
          - label: "导航项"
            name: "items"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "显示文字", name: "label", widget: "string" }
              - { label: "链接地址", name: "href", widget: "string" }
