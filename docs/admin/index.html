<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>内容管理｜英姿律见</title>
  <style>
    :root { font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; color: #182521; background: #f7f4ed; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    .login-card { width: min(420px, calc(100vw - 32px)); padding: 34px; border: 1px solid #d8ddd8; border-top: 4px solid #b89a61; background: #fff; box-shadow: 0 24px 70px rgba(5,31,26,.12); }
    h1 { margin: 0 0 10px; color: #0a2923; font: 700 28px/1.35 "Songti SC", serif; }
    p { margin: 0 0 20px; color: #64706b; line-height: 1.7; }
    label { display: block; margin: 14px 0 6px; color: #103a31; font-weight: 700; }
    input { display: block; inline-size: stretch; min-height: 44px; padding: 8px 12px; border: 1px solid #cfd7d2; border-radius: 4px; font: inherit; box-sizing: border-box; }
    button { display: block; inline-size: stretch; min-height: 46px; margin-top: 20px; border: 0; border-radius: 4px; color: #fff; background: #103a31; font: inherit; font-weight: 800; cursor: pointer; }
    .error { min-height: 22px; margin-top: 12px; color: #9b2d20; font-size: 13px; }
    .note { margin-top: 18px; color: #7b817c; font-size: 12px; }
  </style>
</head>
<body>
  <div class="login-card" id="login-card">
    <h1>英姿律见后台</h1>
    <p>用于本地管理文章、指南、导航栏和基础站点内容。线上发布仍需重新构建并提交到 GitHub。</p>
    <form id="login-form">
      <label for="account">账号</label>
      <input id="account" name="account" autocomplete="username" inputmode="numeric" placeholder="请输入手机号">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
      <button type="submit">登录后台</button>
      <div class="error" id="login-error" role="alert"></div>
    </form>
    <p class="note">提示：这是静态站点的本地管理入口，不作为公网安全认证系统使用。</p>
  </div>
  <script>
    (() => {
      const account = "17775815262";
      const password = "123456";
      const card = document.getElementById("login-card");
      const form = document.getElementById("login-form");
      const error = document.getElementById("login-error");
      const loadCms = () => {
        card.remove();
        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@3/dist/decap-cms.js";
        document.body.appendChild(script);
      };
      if (sessionStorage.getItem("liyingziAdmin") === "1") loadCms();
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const values = new FormData(form);
        if (values.get("account") === account && values.get("password") === password) {
          sessionStorage.setItem("liyingziAdmin", "1");
          loadCms();
        } else {
          error.textContent = "账号或密码不正确";
        }
      });
    })();
  </script>
</body>
</html>
